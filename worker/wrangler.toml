name = "rra-usage"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# `wrangler d1 create rra-usage` prints the database_id — paste it below.
[[d1_databases]]
binding       = "DB"
database_name = "rra-usage"
database_id   = "6b6a5d07-b81f-4618-bf39-cb9871ee6ac2"

# Secrets — set these with `wrangler secret put`, never in this file.
# This file is committed to a public repository.
#
#   openssl rand -hex 32 | npx wrangler secret put RATE_SALT
#   npx wrangler secret put ADMIN_TOKEN
#
# RATE_SALT   salt for rate-limit IP hashing. Must NOT be public: a known
#             salt would let someone brute-force an IP back out of a bucket
#             hash, since the IPv4 space is small enough to enumerate.
# ADMIN_TOKEN bearer token guarding GET /export.

[observability]
enabled = true
